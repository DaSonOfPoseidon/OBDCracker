name: CI

# PR branches are checked once per commit through pull_request; main is checked after each merge.
on:
  push:
    branches: [main]
  pull_request:

# A newer commit on the same PR supersedes a run still in progress. Each push to main gets its
# own group (its run ID), because a group holds only one pending run and would drop a merge.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # rust-toolchain.toml pins the version; rustup installs it on first use.
      - run: rustup show
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --all-features -- -D warnings
      - run: cargo test --all-features
      # obdcracker-core must stay no_std so dongle firmware can reuse it
      - run: cargo build -p obdcracker-core --target thumbv7em-none-eabihf
      - uses: EmbarkStudios/cargo-deny-action@v2
      # GitHub rejects an invalid workflow file without running it, so lint them here
      - run: docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.7
      - run: shellcheck scripts/install.sh

  # Branch protection requires the contexts "build (macos-latest)" etc., and a skipped matrix leg
  # never reports one, so a PR that cannot change the build would wait forever. The macOS legs
  # instead run on ubuntu with their steps skipped, so they report green in seconds without a
  # macOS runner.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - id: diff
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT" != pull_request ]; then
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          files=$(git diff --name-only "$BASE_SHA" HEAD)
          echo "$files"
          if echo "$files" | grep -Eq '(\.rs$|(^|/)Cargo\.(toml|lock)$|^rust-toolchain\.toml$|^deny\.toml$|^scripts/install\.(sh|ps1)$|^\.github/workflows/ci\.yml$|^crates/|^\.cargo/)'; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "code=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: changes
    timeout-minutes: 15
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ (matrix.os == 'macos-latest' && needs.changes.outputs.code != 'true') && 'ubuntu-latest' || matrix.os }}
    env:
      SKIP_LEG: ${{ matrix.os == 'macos-latest' && needs.changes.outputs.code != 'true' }}
    steps:
      - if: env.SKIP_LEG == 'true'
        run: echo "skipped, no build input changed"
      - if: env.SKIP_LEG != 'true'
        uses: actions/checkout@v5
      - if: env.SKIP_LEG != 'true'
        run: rustup show
      - if: env.SKIP_LEG != 'true'
        uses: Swatinem/rust-cache@v2
      - if: env.SKIP_LEG != 'true'
        run: cargo build --release -p obdcracker-cli

  # The install scripts, building this commit (--source) on each OS. The runners already have a
  # linker and rustup, so this covers the skip paths, PATH handling, build and check, not the
  # installs from scratch. Windows uses Windows PowerShell 5.1, what a fresh laptop has.
  install:
    needs: changes
    timeout-minutes: 15
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ (matrix.os == 'macos-latest' && needs.changes.outputs.code != 'true') && 'ubuntu-latest' || matrix.os }}
    env:
      SKIP_LEG: ${{ matrix.os == 'macos-latest' && needs.changes.outputs.code != 'true' }}
    steps:
      - if: env.SKIP_LEG == 'true'
        run: echo "skipped, no build input changed"
      - if: env.SKIP_LEG != 'true'
        uses: actions/checkout@v5
      - if: env.SKIP_LEG != 'true' && matrix.os != 'windows-latest'
        run: sh scripts/install.sh --source .
      - if: env.SKIP_LEG != 'true' && matrix.os == 'windows-latest'
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts\install.ps1 -Source .
      - if: env.SKIP_LEG != 'true'
        run: obdcracker --version

  # The ELM driver against an ELM327 implementation we didn't write (issue #13). Not required
  # by branch protection, and it doesn't fail the run while it settles in.
  elm-emulator:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5
      - run: rustup show
      - uses: Swatinem/rust-cache@v2
      - uses: astral-sh/setup-uv@v6
      # Run as a separate process only: its licence (CC BY-NC-SA 4.0) keeps it out of the repo.
      # v4.0.0 from git: PyPI's 4.0.0 sdist says it's 4.0.0.post57, which uv refuses.
      - run: uv tool install "elm327-emulator @ git+https://github.com/Ircama/ELM327-emulator@ff34d2f72da58c05a1b1f00d04f043e8b6c856fb"
      - run: cargo test -p obdcracker-transport --test elm_emulator -- --ignored
