name: CI

# PR branches are checked once per commit through pull_request; main is checked after each merge.
on:
  push:
    branches: [main]
  pull_request:

# A newer commit on the same PR supersedes a run still in progress. Each push to main gets its
# own group (its run ID), because a group holds only one pending run and would drop a merge.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # rust-toolchain.toml pins the version; rustup installs it on first use.
      - run: rustup show
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --all-features -- -D warnings
      - run: cargo test --all-features
      # obdcracker-core must stay no_std so dongle firmware can reuse it
      - run: cargo build -p obdcracker-core --target thumbv7em-none-eabihf
      - uses: EmbarkStudios/cargo-deny-action@v2
      # GitHub rejects an invalid workflow file without running it, so lint them here
      - run: docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.7
      - run: shellcheck scripts/install.sh

  build:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - run: rustup show
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release -p obdcracker-cli

  # The install scripts, building this commit (--source) on each OS. The runners already have a
  # linker and rustup, so this covers the skip paths, PATH handling, build and check, not the
  # installs from scratch. Windows uses Windows PowerShell 5.1, what a fresh laptop has.
  install:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - if: runner.os != 'Windows'
        run: sh scripts/install.sh --source .
      - if: runner.os == 'Windows'
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts\install.ps1 -Source .
      - run: obdcracker --version

  # The ELM driver against an ELM327 implementation we didn't write (issue #13). Not required
  # by branch protection, and it doesn't fail the run while it settles in.
  elm-emulator:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5
      - run: rustup show
      - uses: Swatinem/rust-cache@v2
      - uses: astral-sh/setup-uv@v6
      # Run as a separate process only: its licence (CC BY-NC-SA 4.0) keeps it out of the repo.
      # v4.0.0 from git: PyPI's 4.0.0 sdist says it's 4.0.0.post57, which uv refuses.
      - run: uv tool install "elm327-emulator @ git+https://github.com/Ircama/ELM327-emulator@ff34d2f72da58c05a1b1f00d04f043e8b6c856fb"
      - run: cargo test -p obdcracker-transport --test elm_emulator -- --ignored
