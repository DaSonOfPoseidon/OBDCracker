[package]
name = "obdcracker-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
obdcracker-core.workspace = true
obdcracker-profile.workspace = true
obdcracker-safety.workspace = true
obdcracker-sim.workspace = true
obdcracker-transport = { workspace = true, features = ["serial", "gsusb", "socketcan", "serde"] }
clap = { version = "4.6.7", features = ["derive"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.145"

[[bin]]
name = "obdcracker"
path = "src/main.rs"

# A raw socket for the simulated car on the other end of vcan0 (tests/socketcan_vcan.rs)
[target.'cfg(target_os = "linux")'.dev-dependencies]
socketcan = { version = "4.0.0", default-features = false }
