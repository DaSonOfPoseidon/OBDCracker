[package]
name = "obdcracker"
description = "Safe-by-construction OBD-II, UDS and KWP2000 communication for any adapter, OS and manufacturer"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
