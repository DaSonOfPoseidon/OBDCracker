# What the simulated A7's modules answer. Module addresses come from the A7 vehicle profile.
#
# Placeholders, not read from the car: part numbers and versions have the right shape but made-up
# values. M4's read-only `fingerprint` session replaces them with the car's real (tuned) values.
# The calibration IDs and CVNs are already the real ones, from the first session (#46). Part and
# hardware numbers are 11 bytes, space-padded, and versions 4 bytes, as real VAG engines and
# transmissions answer (see opendbc-vag.toml).

[[ecu]]
module = "engine"
dtc_format = 0x00

[ecu.obd]
vin = "WAUZZZ4G1EN000000"
# "" is an empty slot: 16 bytes of 0x00, as the engine sends in its second one.
calids = ["4G0401N 0016BVAB", "", "0000000000000000", "NOX00907807 0015", "PMS00906261 4010"]
cvns = ["9B F7 47 0D", "00 00 00 00", "00 00 00 00", "38 D3 FF 82", "0E 1F C3 9E"]
ecu_name = { acronym = "ECM", name = "EngineControl" }
dtcs = ["P0299"]

# Mode 01 PID → data bytes: coolant 90 °C, 800 rpm, 0 km/h, 14.0 V
[ecu.obd.pids]
"05" = "82"
"0C" = "0C 80"
"0D" = "00"
"42" = "36 B0"

