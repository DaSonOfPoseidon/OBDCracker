# What the simulated A7's modules answer. Module addresses come from the A7 vehicle profile.
#
# Every value is what the car (tuned, EGR-deleted) sent, ignition on and engine off: mode 09 VIN,
# CALIDs and CVNs from the first read-only session (#46, 2026-10-10), and everything else from the
# second (#49, 2026-10-10). A DID that isn't listed was refused with NRC 0x31 (request out of
# range), as the car refused it.
#
# Differences from the car, because the sim can't express them yet:
# - The engine also lists mode 09 PID 0B in its PID 00 bitmap; the sim builds that bitmap from the
#   PIDs it has, so 0B is missing.
# - The transmission sent one response-pending (7F 19 78) before its DTC list; the sim models
#   response-pending only for DIDs.
# - Whether a module answers ReadDTCInformation 0x0A (supported DTCs) is untested; only 0x02 is
#   listed, since 0x01 was refused (NRC 0x12) and 0x0A wasn't asked.
#
# UDS DTCs are each module's full table as `19 02 FF` returned it. Every status is "test not
# completed" (0x10, 0x40 or 0x50): none is failed, pending or confirmed.

