# What the simulated A7's modules answer. Module addresses come from the A7 vehicle profile.
#
# Every value is what the car (tuned, EGR-deleted) sent. The engine, transmission, gateway and
# instruments are from the first two read-only sessions, ignition on and engine off: mode 09 VIN,
# CALIDs and CVNs from #46 (2026-10-10), and everything else from #49 (2026-10-10). The other
# modules are the ones `scan --discover` found in the third session (#54, 2026-10-11), with the
# engine idling. A DID that isn't listed was refused with NRC 0x31 (request out of range), as the
# car refused it.
#
# Quirks the car showed, which the sim reproduces:
# - The transmission sent one response-pending (7F 19 78) before its DTC list, and so did the
#   brakes, airbag and parking brake in #54 (`dtc_pending`). The engine did too in #54, with the
#   engine idling, but not in #49, which its values come from.
# - The airbag answered 19 01 AF with 59 01 00 00, too short to decode, after one response-pending
#   (`[[ecu.raw]]`).
# - The night vision module refused F190 with NRC 0x22 (conditions not correct), not 0x31.
#
# Differences from the car, because the sim can't express them yet:
# - The engine also lists mode 09 PID 0B in its PID 00 bitmap; the sim builds that bitmap from the
#   PIDs it has, so 0B is missing.
# - Whether a module answers ReadDTCInformation 0x0A (supported DTCs) is untested; only 0x02 is
#   listed, plus 0x01 for the one module that answered it (the sensor cluster). The others refused
#   0x01 (NRC 0x12).
# - #54 didn't read the coding (0600) of the modules it found, so the sim refuses it for them.
#
# The first four modules' UDS DTCs are each one's full table as `19 02 FF` returned it. Every status
# is "test not completed" (0x10, 0x40 or 0x50): none is failed, pending or confirmed. The modules
# from #54 list only what `19 02 AF` (the fault bits) returned, so their tables hold just the
# faults: night vision, and both ACC radars.

