[package]
name = "obdcracker-transport"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[features]
# USB serial adapters, such as the OBDLink EX
serial = ["dep:serial2"]
# gs_usb adapters (CANable, candleLight), over USB with no driver on Linux, Windows or macOS
gsusb = ["dep:nusb"]

[dependencies]
obdcracker-core.workspace = true
obdcracker-safety.workspace = true
serial2 = { version = "0.2.38", optional = true }
nusb = { version = "0.2.9", optional = true }

[lints]
workspace = true

[dev-dependencies]
proptest = "1.11.0"
serde_json = "1.0.145"
serial2 = { version = "0.2.38", features = ["unix"] }
