# `scan --discover` tries each request ID here with `22 F187`, expecting replies at the request ID
# + 0x6A. 0x700..=0x769 is as far as that goes safely: the replies (0x76A..=0x7D3) are never a
# request ID, so nothing sent looks like another module's reply. It covers the modules above and
# opendbc's VW firmware query addresses (0x712 steering, 0x715 airbag, 0x74F camera, 0x757 radar;
# see docs/third-party.md).
#
# `scan --discover --wide` then tries 0x76A..=0x795 (replies up to 0x7FF), for modules such as the
# MMI (5F), which VW's MQB cars put at 0x773/0x7DD; the C7's IDs aren't confirmed. Those request IDs
# are the first pass's reply IDs. The wide pass skips each one a module it knows of (listed above,
# or found by the first pass) answers on, and each whose reply would be an OBD-II ID, but a module
# silent in the first pass could still own one. The user accepted that (2026-10-12): such a read
# is a frame no module receives, since modules only send on their reply IDs.
[discovery]
first_request_id = 0x700
last_request_id = 0x769
reply_offset = 0x6A
wide_last_request_id = 0x795

# VAG's 29-bit diagnostic IDs (requests 0x17FC00xx, replies 0x17FE00xx), for modules that are
# silent on 11-bit ISO-TP (#89, #111). Hobbyist sources, unconfirmed on this car.
[discovery_29bit]
first_request_id = 0x17FC0000
last_request_id = 0x17FC00FF
reply_offset = 0x20000

# The modules that stayed silent on 11-bit ISO-TP in car session 5 (#92), though Ross-Tech's C7
# scan lists them: comfort 05/46 (J393), 09 (J519), 16 (J527), 36 (seat) and 42/52/62/72
# (doors), and infotainment/MOST 0E, 47, 56 and 5F (MMI). TP2.0 is the main guess for them; none
# is confirmed (#124). Car session 6 found 52 on TP2.0; the second row is the other addresses that
# the gateway's 2A29 table marks 02, as it does 52 (#169).
[discovery_tp20]
addresses = [
    0x05, 0x09, 0x0E, 0x16, 0x36, 0x42, 0x46, 0x47, 0x52, 0x56, 0x5F, 0x62, 0x72,
    0x06, 0x10, 0x14, 0x18, 0x1E, 0x20, 0x2E, 0x30, 0x3C, 0x3D, 0x3E, 0x48, 0x57, 0x5B, 0x69, 0x7F,
]
