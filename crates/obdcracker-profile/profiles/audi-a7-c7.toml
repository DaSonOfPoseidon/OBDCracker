# 2014 Audi A7 3.0 TDI (C7, platform 4G).
#
# The first four modules come from public VAG UDS references, and the second read-only session
# (#49) confirmed them. The rest are what `scan --discover` found in the third (#54, engine idling).
# Every module answered on its request and reply IDs: a VAG reply ID is the request ID + 0x6A,
# except for the OBD-II pairs. A module's VAG address is given only where a public source confirms it:
# the head-up display's 0x82 is from an Audi bulletin (J898, "diag. addr. 0082").
# Standard identification DIDs (0xF180..=0xF19F) need no entry; they're listed here to give their
# length, which lets a scan read several in one request. Each length is the data (not the whole
# reply) this car's module sent in #49 or #54, so it holds for these ECU variants (part numbers),
# not every A7; `tests/data/a7-did-replies.txt` keeps those replies, and a test checks each length
# against them. A DID the module refused has no length. F18B (manufacture date) is listed to show it
# as bytes: it's BCD, such as 13 11 19, and all zeros when unset. 0x0600 (VW coding) is listed on
# every module that answered it in #86, so a scan reads it; the sensor cluster, tire pressure and
# parking brake refused it as out of range, and the transmission wasn't asked. The rest are VAG
# extras. The head-up display's DIDs below 0x1000 are what the #86 sweeps found; their meanings
# aren't known yet. The gateway's 0x0664..=0x0754 are what the #92 sweep found for its one LIN
# sub-system, the battery monitor J367: one DID per field, 0x30 apart (part number, software
# version, hardware number, hardware version, serial number, system name), going by their values.
# The same sweep found counters, flags and timestamped logs (0x0420..=0x049F); they aren't listed.

