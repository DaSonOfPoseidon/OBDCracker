# 2014 Audi A7 3.0 TDI (C7, platform 4G).
#
# The layout comes from public VAG UDS references, and the second read-only session (#49) confirmed
# every module here: each answered on its request and reply IDs (a VAG reply ID is the request ID
# + 0x6A, except the OBD-II pairs).
# Standard identification DIDs (0xF180..=0xF19F) need no entry. F18B (manufacture date) is listed
# to show it as bytes: it's BCD, such as 13 11 19, and all zeros when unset. F197 (system name) is
# listed to name it; the rest are VAG extras.

name = "2014 Audi A7 3.0 TDI (C7)"
bitrate = 500000

[[module]]
name = "engine"
vag_address = 0x01
request_id = 0x7E0
response_id = 0x7E8
protocol = "uds"

[[module.did]]
id = 0xF18B
name = "manufacture date"
decode = "hex"

[[module.did]]
id = 0xF197
name = "system name"
decode = "text"

[[module.did]]
id = 0xF1A3
name = "VW ECU hardware version"
decode = "text"

[[module.did]]
id = 0xF1AA
name = "VW workshop system name"
decode = "text"

[[module.did]]
id = 0x0600
name = "VW coding value"
decode = "hex"

[[module]]
name = "transmission"
vag_address = 0x02
request_id = 0x7E1
response_id = 0x7E9
protocol = "uds"

[[module.did]]
id = 0xF18B
name = "manufacture date"
decode = "hex"

[[module.did]]
id = 0xF197
name = "system name"
decode = "text"

[[module.did]]
id = 0xF1A3
name = "VW ECU hardware version"
decode = "text"

[[module.did]]
id = 0xF1AA
name = "VW workshop system name"
decode = "text"

[[module]]
name = "gateway"
vag_address = 0x19
request_id = 0x710
response_id = 0x77A
protocol = "uds"

[[module.did]]
id = 0xF18B
name = "manufacture date"
decode = "hex"

[[module.did]]
id = 0xF197
name = "system name"
decode = "text"

[[module.did]]
id = 0x0600
name = "VW coding value"
decode = "hex"

[[module]]
name = "instruments"
vag_address = 0x17
request_id = 0x714
response_id = 0x77E
protocol = "uds"

[[module.did]]
id = 0xF18B
name = "manufacture date"
decode = "hex"

[[module.did]]
id = 0xF197
name = "system name"
decode = "text"

[[module.did]]
id = 0x0600
name = "VW coding value"
decode = "hex"
