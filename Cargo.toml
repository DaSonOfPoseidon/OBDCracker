[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "MIT"
repository = "https://github.com/DaSonOfPoseidon/OBDCracker"

[workspace.dependencies]
obd-core = { path = "crates/obd-core" }
obd-safety = { path = "crates/obd-safety" }
obd-transport = { path = "crates/obd-transport" }
obd-sim = { path = "crates/obd-sim" }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
