[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "MIT"
repository = "https://github.com/DaSonOfPoseidon/OBDCracker"
publish = false

[workspace.dependencies]
obdcracker = { path = "crates/obdcracker" }
obdcracker-core = { path = "crates/obdcracker-core" }
obdcracker-safety = { path = "crates/obdcracker-safety" }
obdcracker-profile = { path = "crates/obdcracker-profile" }
obdcracker-transport = { path = "crates/obdcracker-transport" }
obdcracker-sim = { path = "crates/obdcracker-sim" }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"
missing_docs = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
